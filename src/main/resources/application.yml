spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-red-smoke-ay31v4nv.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require&connect_timeout=10&socket_timeout=30}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_5kAZU6YgqORh}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 30000
      minimum-idle: 1
      maximum-pool-size: 5
      initialization-fail-timeout: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:kanchuk-super-secret-key-change-in-production-must-be-at-least-256-bits}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

storage:
  type: local                              # switch to "s3" when ready
  local:
    upload-dir: ./uploads                  # relative to where the JAR runs
    base-url: http://localhost:8080/uploads

logging:
  level:
    in.kanchuk: INFO
    org.flywaydb: INFO
