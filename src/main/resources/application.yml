spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-red-smoke-ay31v4nv.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require&connect_timeout=30&socket_timeout=30&tcpKeepAlive=true}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_5kAZU6YgqORh}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 60000        # 60s — gives Neon enough time to wake from cold start
      idle-timeout: 300000             # 5 min — retire idle connections before Neon suspends them
      max-lifetime: 600000             # 10 min — hard ceiling well under Neon's server-side close
      keepalive-time: 120000           # 2 min — keeps compute awake between requests
      minimum-idle: 0                  # don't maintain background connections Neon will close
      maximum-pool-size: 5
      initialization-fail-timeout: -1  # don't fail startup if DB is initially unreachable

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

    validate-on-migrate: false

    ignore-migration-patterns: "*:missing"

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:kanchuk-super-secret-key-change-in-production-must-be-at-least-256-bits}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

storage:
  type: local                              # switch to "s3" when ready
  local:
    upload-dir: ./uploads                  # relative to where the JAR runs
    base-url: http://localhost:8080/uploads

sms:
  provider: mock     # mock | msg91 | twilio — swap without changing business logic
  enabled: true      # set false to suppress all SMS (order and OTP) without errors

otp:
  length: 6
  expiry-minutes: 5
  max-attempts: 5
  resend-cooldown-seconds: 60

logging:
  level:
    in.kanchuk: INFO
    org.flywaydb: INFO
